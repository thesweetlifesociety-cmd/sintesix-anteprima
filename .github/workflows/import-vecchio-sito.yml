name: Import dal vecchio sito
on:
  push:
    branches: [import-vecchio-sito]
    paths: ['_import/pagine.txt', '_import/scarica.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _import/scarica.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add _import
          git commit -m "Import: pagine e immagini dal vecchio sito" || echo "niente da salvare"
          git push
